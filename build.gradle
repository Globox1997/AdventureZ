plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven { url = "https://maven.shedaniel.me/" }
	maven { url = "https://maven.terraformersmc.com/" }
	maven { url = "https://api.modrinth.com/maven" }
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	// Config
	implementation("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
		exclude(group: "net.fabricmc.fabric-api")
	}
	// Modmenu
	compileOnly localRuntime("com.terraformersmc:modmenu:${project.mod_menu_version}") {
		exclude(group: "net.fabricmc.fabric-api")
	}
	// Patchouli
	compileOnly("maven.modrinth:patchouli:${project.patchouli_version}") {
		transitive = false
	}
	// Iris
	compileOnly("maven.modrinth:iris:1.11.7+26.3-fabric") {
		transitive = false
	}
}

processResources {
	def expandProps = [
			"version"             : project.version,
			"fabric_version"      : project.fabric_version,
			"loader_version"      : project.loader_version,
			"minecraft_version"   : project.minecraft_version,
			"cloth_config_version": project.cloth_config_version
	]
	inputs.properties(expandProps)

	filesMatching("fabric.mod.json") {
		expand expandProps
	}
}

java {
	toolchain.languageVersion = JavaLanguageVersion.of(project.java_version)
	withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = "UTF-8"
	it.options.release = Integer.parseInt(project.java_version)
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
		}
	}

	repositories {
	}
}
